<div class="auth-container">
    <div class="auth-card">

        <h2>Login</h2>

        <div class="form-group">
            <label>Email</label>
            <input type="email" (blur)="emailTouch=true" placeholder="Enter email" [(ngModel)]="email">

            @if(emailTouch && !email){
            <p class="valid">Email is required</p>
            }

        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password" [(ngModel)]="password">
            @if(password && password.length < 6){ <p class="valid">Password must be at least 6 characters</p>}
        </div>

        <button class="btn" (click)="login()">
            Login
        </button>

        <p>
            Don't have an account?
            <a routerLink="/register">Register</a>
        </p>

    </div>
</div>
