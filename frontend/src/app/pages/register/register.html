<div class="auth-container">
  <div class="auth-card">

    <h2>Create Account</h2>

    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        placeholder="Enter name"
        [(ngModel)]="name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        (blur)="emailTouch=true"
        placeholder="Enter email"
        [(ngModel)]="email">
            @if(emailTouch && !email){
    <p class="valid">Email is required</p>
    }

    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        placeholder="Enter password"
        [(ngModel)]="password">
           @if(password && password.length < 6){ <p class="valid">Password must be at least 6 characters</p>}


    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input
        type="password"
        placeholder="Enter password"
        [(ngModel)]="confirmPassword">
          @if(confirmPassword &&password !== confirmPassword){<p class="valid" >Password is not Match</p>}
    </div>

    <button class="btn" (click)="register()">
      Register
    </button>

    <p>
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>
</div>
