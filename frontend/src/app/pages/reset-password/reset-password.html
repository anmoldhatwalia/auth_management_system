<div class="auth-container">

  <div class="auth-card">

    <h2>Reset Password</h2>

    <div class="form-group">

      <label>New Password</label>

      <input
        type="password"
        [(ngModel)]="password">

    </div>

    <div class="form-group">

      <label>Confirm Password</label>

      <input
        type="password"
        [(ngModel)]="confirmPassword">

    </div>

    <button
      class="btn"
      (click)="resetPassword()">

      Reset Password

    </button>

  </div>

</div>
