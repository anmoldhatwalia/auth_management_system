<div class="auth-container">

  <div class="auth-card">

    <h2>Forgot Password</h2>

    <p class="subtitle">
      Enter your email address
    </p>

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Enter email">

    </div>

    <button
      class="btn"
      (click)="sendLink()">

      Send Reset Link

    </button>

    <p>

      Back to

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
